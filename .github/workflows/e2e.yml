name: E2E Tests

# Same PR-time quality gate pattern as lighthouse.yml - builds and tests in a
# throwaway CI runner, no credentials, doesn't touch Cloudflare. Separate
# workflow (not a step tacked onto lighthouse.yml) so a slow/flaky E2E run
# never blocks the Lighthouse audit from reporting, and vice versa.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 14
