name: Lint

# Same PR-time quality gate pattern as the other workflows here - a separate
# job so a lint failure is never masked by a slower build/test/audit run.
# Only runs `eslint .` - NOT `prettier --check`. The codebase predates
# Prettier and hasn't had a full-repo format pass yet (a real, deliberate
# decision, not an oversight - see docs/todolist.md); `format`/`format:check`
# scripts exist in package.json for local use once that pass happens.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint
